  <script>
    (function () {
      var list = document.getElementById('reclamations-list');
      var totalEl = document.getElementById('summary-total');
      var pendingEl = document.getElementById('summary-pending');
      var doneEl = document.getElementById('summary-done');
      if (!list || !totalEl || !pendingEl || !doneEl) return;

      function getControllerUrl(action) {
        if (window.location.protocol === 'file:') {
          return 'http://localhost/TakwiniBot%20-%20Copie/controllers/ReclamationController.php?action=' + encodeURIComponent(action);
        }
        var basePath = window.location.pathname.split('/views/')[0];
        if (!basePath) basePath = '/TakwiniBot%20-%20Copie';
        return window.location.origin + basePath + '/controllers/ReclamationController.php?action=' + encodeURIComponent(action);
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatDate(value) {
        if (!value) return '-';
        var date = new Date(String(value).replace(' ', 'T'));
        if (Number.isNaN(date.getTime())) return escapeHtml(value);
        return date.toLocaleString('fr-FR');
      }

      function getStoredIds() {
        try {
          var ids = JSON.parse(localStorage.getItem('takwini_reclamation_ids') || '[]');
          return Array.isArray(ids) ? ids.filter(Boolean) : [];
        } catch (error) {
          return [];
        }
      }

      function getStatusMeta(statut) {
        var value = String(statut || '').toLowerCase().replace(/\s+/g, '_');
        if (value === 'traite') {
          return { label: 'Traitée', className: 'status-done' };
        }
        return { label: 'En attente', className: 'status-pending' };
      }

      function renderStats(rows) {
        var pending = 0;
        var done = 0;
        rows.forEach(function (item) {
          var statut = String(item.statut || '').toLowerCase().replace(/\s+/g, '_');
          if (statut === 'traite') {
            done += 1;
          } else {
            pending += 1;
          }
        });
        totalEl.textContent = String(rows.length);
        pendingEl.textContent = String(pending);
        doneEl.textContent = String(done);
      }

      function renderRows(rows) {
        renderStats(rows);
        if (!rows.length) {
          list.innerHTML = '<div class="reclamation-card"><p class="mb-0 text-muted">Aucune réclamation trouvée. Déposez une demande ou ouvrez cette page depuis le formulaire (réclamations enregistrées sur cet appareil).</p></div>';
          return;
        }

        list.innerHTML = rows.map(function (item) {
          var status = getStatusMeta(item.statut);
          var responseHtml = '';
          if (item.reponse) {
            responseHtml =
              '<div class="admin-response">' +
                '<strong><i class="fa fa-envelope"></i> Réponse administrateur:</strong>' +
                '<p class="mb-1 mt-2">' + escapeHtml(item.reponse) + '</p>' +
                '<small>Reçue le ' + formatDate(item.date_reponse) + '</small>' +
              '</div>';
          }

          return (
            '<div class="reclamation-card">' +
              '<div class="d-flex justify-content-between align-items-center flex-wrap mb-2">' +
                '<h4 class="mb-2">' + escapeHtml(item.sujet || '-') + '</h4>' +
                '<span class="status-badge ' + status.className + '">' + escapeHtml(status.label) + '</span>' +
              '</div>' +
              '<p class="reclamation-meta"><i class="fa fa-calendar"></i> ' + formatDate(item.date_creation) + ' · ' + escapeHtml(item.type || '-') + '</p>' +
              '<p>' + escapeHtml(item.message || '') + '</p>' +
              responseHtml +
            '</div>'
          );
        }).join('');
      }

      async function loadReclamations() {
        var params = new URLSearchParams(window.location.search);
        var userId = params.get('user_id');
        var ids = params.get('ids') || getStoredIds().join(',');

        if (!userId && !ids) {
          renderRows([]);
          return;
        }

        var url = new URL(getControllerUrl('list'));
        if (userId) {
          url.searchParams.set('user_id', userId);
        } else {
          url.searchParams.set('ids', ids);
        }

        try {
          var response = await fetch(url.toString(), { method: 'GET' });
          var text = await response.text();
          var json = text ? JSON.parse(text) : null;
          if (!response.ok || !json || !json.success) {
            throw new Error((json && json.message) || 'Impossible de charger les réclamations.');
          }
          renderRows(Array.isArray(json.data) ? json.data : []);
        } catch (error) {
          list.innerHTML = '<div class="reclamation-card"><p class="mb-0 text-danger">' + escapeHtml((error && error.message) || 'Erreur réseau.') + '</p></div>';
          renderStats([]);
        }
      }

      loadReclamations();
    })();
  </script>
